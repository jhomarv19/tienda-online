<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Online Simple</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="{{ url_for('index') }}" class="nav-logo">
                <i class="fas fa-store"></i> Tienda Online
            </a>
            <div class="nav-links">
                <a href="{{ url_for('index') }}"><i class="fas fa-home"></i> Inicio</a>
                <a href="{{ url_for('cart_page') }}" class="cart-link">
                    <i class="fas fa-shopping-cart"></i> Carrito
                    <span id="cart-count" class="cart-count">0</span>
                </a>
                <a href="{{ url_for('admin') }}"><i class="fas fa-cog"></i> Admin</a>
            </div>
        </div>
    </nav>
    
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    
    <footer class="footer">
        <p>Tienda Online Simple &copy; 2023 - Todos los derechos reservados</p>
    </footer>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
